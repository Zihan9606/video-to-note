name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build macOS app
        run: ./scripts/build_app.sh --python "$(command -v python)" --skip-install

      - name: Read version
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' launcher.py | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package app
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent "VideoToNo-${VERSION}-macos.app" "VideoToNo-${VERSION}-macos.zip"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/VideoToNo-${{ env.VERSION }}-macos.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.4.2 更新
          - **测试连接不再把成功报成 500**：模型对连通性探测的回信如果被输出额度截成半个 emoji（未配对的代理对字符），本机后端会在响应序列化成 JSON 的那一步抛 UnicodeEncodeError。崩点在端点 return 之后，罩在端点里的异常处理抓不到，于是只回一句纯文本 Internal Server Error，前端落到兜底话术「测试请求失败（HTTP 500）」——看着完全像上游挂了，其实是我们自己崩了，而且换一个模型或重问一次就可能不复现（同批次里另一位用户自己的 Key 实测正常就是这个原因）。模型文本进入响应的两处边界现在先过一遍 utf8_safe（测试回信摘录、流式正文汇总）；同一个字符随正文流到 notes.md 与 task.json 的 UTF-8 落盘时会把整条任务一起带崩，一并挡掉
          - **后端崩溃一律回 JSON**：任何没兜住的异常现在返回「后端内部错误：<异常类型> <原因>（详情见本机 _app.log）」，异常文本沿用 1.4.1 的脱敏口径、不带明文 Key；traceback 仍由 Starlette 原样上抛进日志。这一步只为把话说清楚——裸 500 的纯文本让前端取不到原因，报障时分不清是后端崩了还是端口被别的服务占着
          - **B 站失败原因不再被抹平成 code=None**：风控回退通道（视频页 412 时改走 api.bilibili.com 的 view 接口）以前把请求异常整个吞掉、返回空字典，用户只看到「view 接口未返回可用数据（code=None）」，而 412、超时、DNS 失败、代理被重置、返回一页 HTML 全长得一样。现在分别写成 HTTP 412 Precondition Failed、连接失败（原因）、响应不是可解析的 JSON，B 站自己给的 message 也一并带上——BV 号不存在时那句「请求错误」能当场看出是链接的问题而不是软件的问题。传输层就没通时不再补一次 wbi 签名重试（签名救不了 412，超时场景白等 20 秒）
          - **不再对着坏链接劝人扫码**：上面那句报错末尾原本无条件写着「请先扫码导入 SESSDATA」。有用户对着一个查不到的 BV 号反复重新登录、多次无果——现在 B 站明确说目标不对（-400 / -404）或接口压根连不上时不再挂这句提示
          - **「模型未返回正文」报的是实况**：以前只有一句 finish_reason=length。现在写清「下发 max_tokens=4600、思考档=off，实际收到 思考 6473 字 / 正文 0 字」——通道静默忽略关思考的请求、或者悄悄把 max_tokens 砍小，都不会回 400，参数降级阶梯因此不触发，光看 finish_reason 猜不到额度是谁缩的。配套地：思考档已经是 off 却仍只收到思考时，改说「该通道没有响应关思考的请求，请改用高或最大档给正文留出额度」，不再劝一个已经关着思考的人去关思考，也不再白跑一次注定相同的重试；这个事实按通道级在运行记录里说一句（逐段直写会调几十次，不刷屏）。顺带修正流式计数：reasoning 与 content 在同一块到达时原来走 elif，两个都不计
          - **内置模型档位跟到各家当前 ID**：DeepSeek 默认档换成 deepseek-flash（官方已把 deepseek-v4-flash 对应的模型下线，请求实际由 DeepSeek-V4.1-Flash 服务并按 Flash 计价，用户看着选的是旧档、跑的却是新模型、账单口径也对不上）；智谱 GLM 默认档原写的 glm-4.5-flash 已于 2026-01-30 下线（官方页写明请求自动路由到 glm-4.7-flash），免费档换成 glm-4.7-flash 并补上 GLM-5.3 / GLM-5.2；通义补 qwen3.8-max / qwen3.8-flash（官方模型页已不列 3.7 的这两档，qwen3.7-plus 仍在列、默认档不动）；Kimi 三条与 OpenAI 三条经核仍然正确，未改。**旧 ID 一条都没删**：下拉的兜底行为是「ID 不在列表里就跳到手动输入，而输入框读的是另一个字段」，删预设等于让存过该 ID 的老用户那个框直接变空。新增一条结构测试，把五家的接口地址与默认档在前后端逐一对齐（两处各写一份，只改一边就会出现页面选新模型、实际请求打旧 ID）
          - **界面文件读不到时说明状况**：浏览器打开本机地址只剩一句 {"detail":"Not Found"}——前端是条件挂载，目录读不到时 /api/* 全部正常而 / 匹配不到任何路由，看着完全像端口被别的软件占了；重启软件会重新解压，所以表现为「重启就好了」。现在改回一页以「下一步做什么」为主的说明（托盘退出重开，反复出现就带上 _app.log 和端口号），并把本机端口显示在标题栏版本后面、托盘 tooltip 里
          - **换了链接按钮文案跟着变**：跑完一次任务后按钮停在「再次生成 / 重新提交 / 重新开始」，此时贴一个新链接文案仍然写着「再次」——行为是对的（拿新链接从头跑），但看着像还在接着上一个任务。现在改链接、切来源类型、重选媒体文件都会回到「开始生成 / 开始转写」；任务进行中与从「最近任务」打开旧任务时不改
          - **验证**：本机 pytest 309 通过（本批新增 13 条）。8 种病态上游响应逐个打 /api/llm-test，修复前那一种回纯文本 500、修复后全部 200；真 uvicorn 子进程与打包 exe 各跑一遍崩溃用例；打包产物上核过版本号（FileVersion 1.4.2.0）、五家模型下拉渲染、存过旧 ID 的档案仍各自选中、404 页与标题端口显示、按钮文案八个状态；前后端对齐那条做了变异验证（把前端改回旧值当场红）。**没验到的**：新档位没有一条拿真 Key 打过，全部依据是各家官方文档（OpenAI 官方模型页 403 取不到，所以那三条没动）；B 站与思考额度两条新文案需要真实故障条件才会走到，产物上只验到没把原有路径改坏

          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
